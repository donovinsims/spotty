<style>

            0% { transform: scale(0.95); opacity: 0.8; stroke-width: 4px; }
            50% { transform: scale(1.05); opacity: 1; stroke-width: 6px; filter: drop-shadow(0 0 12px rgba(83, 224, 118, 0.8)); }

        .animate-progress-ring {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            transform-origin: center;
        }

        @keyframes progress-dash {
            0% { stroke-dasharray: 0, 100; }
            100% { stroke-dasharray: 65, 100; } /* Simulating 65% complete */
        }

        .animate-dash {
            animation: progress-dash 1.5s ease-out forwards;
        }

            background: linear-gradient(to bottom, #53e076 50%, #353534 50%);
            background-size: 100% 200%;
            animation: flow-line 2s linear infinite;

<!-- Background track -->
<svg class="absolute w-full h-full text-surface-variant -rotate-90" viewbox="0 0 36 36">
<path class="stroke-current" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke-width="2"></path>
</svg>
<!-- Active pulsing progress track -->

<path class="stroke-current animate-progress-ring animate-dash" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke-dasharray="65, 100" stroke-linecap="round" stroke-width="2"></path>

</div>
