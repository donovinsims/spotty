{% extends "base.html" %}
{% block title %}{{ status_code }}{% endblock %}
{% block content %}
<h1>{{ status_code }}</h1>
<p class="muted">{{ detail }}</p>
{% if status_code == 500 %}<p class="muted">Something went wrong on the server. Try again in a moment.</p>{% endif %}
<p><a class="btn" href="/">Back home</a></p>
{% endblock %}
