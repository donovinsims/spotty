<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12151c">
  <title>{% block title %}podcast-transcriber{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script>
    // PWA-lite: cache the app shell for offline start.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">podcast-transcriber</a>
    <nav class="topnav">
      <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>New</a>
      <a href="/jobs" {% if request.url.path.startswith("/jobs") %}aria-current="page"{% endif %}>Jobs</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span class="muted">local · private · runs entirely on this machine
      {% if auth_enabled %}<span class="muted">· token auth on</span>{% endif %}
    </span>
    {% if auth_enabled %}
    <form class="logout-form" method="post" action="/logout">
      <button type="submit" class="btn btn-ghost btn-small">Sign out</button>
    </form>
    {% endif %}
  </footer>
</body>
</html>
